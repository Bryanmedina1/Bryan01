<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
  <meta charset="utf-8">
  <title>Drum Kit</title>
  <link rel="stylesheet" href="styles.css">
  <link href="https://fonts.googleapis.com/css?family=Arvo" rel="stylesheet">
</head>

<body>
  <h1 id="title">Drum 🥁 Kit</h1>
  <div class="set">
    <button type="button" class="w drum" aria-label="Tom 1 (W)">w</button>
    <button type="button" class="a drum" aria-label="Tom 2 (A)">a</button>
    <button type="button" class="s drum" aria-label="Tom 3 (S)">s</button>
    <button type="button" class="d drum" aria-label="Tom 4 (D)">d</button>
    <button type="button" class="j drum" aria-label="Snare (J)">j</button>
    <button type="button" class="k drum" aria-label="Crash (K)">k</button>
    <button type="button" class="l drum" aria-label="Kick bass (L)">l</button>
  </div>


<script src="index.js" charset="utf-8"></script>

<footer>
  Put a footer content here!!
</footer>
</body>
</html>
